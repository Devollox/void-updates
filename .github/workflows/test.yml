name: Build and Package Test

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            wails_platform: windows/amd64
            asset_pattern: 'Void.Presence.Setup.*.exe'
          - platform: macos
            os: macos-latest
            wails_platform: darwin/universal
            asset_pattern: 'Void.Presence.*.dmg'
          - platform: linux
            os: ubuntu-latest
            wails_platform: linux/amd64
            asset_pattern: 'Void.Presence.*.amd64.deb'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Clean binary folder
        shell: bash
        run: |
          mkdir -p binary
          rm -f binary/*.exe binary/*.dmg binary/*.deb binary/*.rpm binary/*.zip

      - name: Download latest void-presence installer (${{ matrix.platform }})
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_PATTERN: ${{ matrix.asset_pattern }}
        run: |
          OWNER="Devollox"
          REPO="void-presence"

          RELEASE_JSON=$(gh api "repos/$OWNER/$REPO/releases/latest")
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "Latest release: $TAG"

          ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r --arg pat "$ASSET_PATTERN" '
            .assets[]
            | select(.name | test($pat | gsub("\\*"; ".*")))
            | .name
          ' | head -1)

          if [ -z "$ASSET_NAME" ]; then
            echo "ERROR: No asset matching '$ASSET_PATTERN' in release $TAG"
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading: $ASSET_NAME"

          gh release download "$TAG" \
            --repo "$OWNER/$REPO" \
            --pattern "$ASSET_NAME" \
            --dir binary

          echo "=== binary folder ==="
          ls -lh binary/

      - name: Parse version and update wails.json
        id: ver
        shell: bash
        run: |
          FILE=$(ls binary/ | head -1)
          echo "Found: $FILE"
          BASE="${FILE%.*}"
          BASE="${BASE%.amd64}"
          BASE="${BASE%.x86_64}"
          VERSION="${BASE#Void.Presence.Setup.}"
          VERSION="${VERSION#Void.Presence.}"
          echo "Parsed version: $VERSION"

          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wails.json','utf8'));
            cfg.outputfilename = 'Void.Presence.Updates.$VERSION';
            fs.writeFileSync('wails.json', JSON.stringify(cfg, null, 2));
            console.log('wails.json updated:', cfg.outputfilename);
          "

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run version synchronization
        run: node scripts/sync-version.js

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gcc \
            pkg-config

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app (${{ matrix.platform }})
        shell: bash
        run: |
          wails build -clean -platform ${{ matrix.wails_platform }}
          echo "=== build/bin ==="
          ls -lh build/bin/ || true

      - name: Locate and rename output (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $src = "build\bin\Void.Presence.Updates.$ver.exe"
          if (-not (Test-Path $src)) { Get-ChildItem build\bin; throw "Not found: $src" }
          Write-Host "Output: $src"
          "OUTPUT_FILE=$src" >> $env:GITHUB_ENV

      - name: Locate and rename output (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          APP=$(ls build/bin/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            BIN=$(ls build/bin/ | head -1)
            ZIP="build/bin/Void.Presence.Updates.$VER.macos.zip"
            zip -j "$ZIP" "build/bin/$BIN"
          else
            ZIP="build/bin/Void.Presence.Updates.$VER.macos.zip"
            zip -r "$ZIP" "$APP"
          fi
          echo "OUTPUT_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Locate and rename output (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          SRC="build/bin/Void.Presence.Updates.$VER"
          DEST="build/bin/Void.Presence.Updates.$VER.linux"
          mv "$SRC" "$DEST"
          chmod +x "$DEST"
          echo "OUTPUT_FILE=$DEST" >> "$GITHUB_ENV"

      - name: Verify output
        shell: bash
        run: ls -lh "$OUTPUT_FILE"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-updater-${{ matrix.platform }}
          path: ${{ env.OUTPUT_FILE }}
          retention-days: 3
